<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <!-- Optional subtle gradient on background for extra crispness -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A73E8" />
      <stop offset="100%" stop-color="#0B57D0" />
    </linearGradient>
  </defs>

  <!-- Background (exact #0D6EFD base) -->
  <rect width="108" height="108" fill="#0D6EFD" />

  <!-- Background Diagonal Lines -->
  <line x1="0" y1="0" x2="108" y2="108" stroke="#FFFFFF" stroke-opacity="0.133" stroke-width="0.5" />
  <line x1="108" y1="0" x2="0" y2="108" stroke="#FFFFFF" stroke-opacity="0.133" stroke-width="0.5" />

  <!-- Background Radar Rings -->
  <circle cx="54" cy="54" r="30" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.2" fill="none" />
  <circle cx="54" cy="54" r="42" stroke="#FFFFFF" stroke-opacity="0.133" stroke-width="0.8" fill="none" />

  <!-- 1. Relay Schematic Circuit Terminals (Left & Right) -->
  <path d="M14,54 L22,54" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <circle cx="22" cy="54" r="3" fill="#FFFFFF" />

  <path d="M86,54 L94,54" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <circle cx="86" cy="54" r="3" fill="#FFFFFF" />

  <!-- Relay Switch Contact Arm -->
  <path d="M24,52 L34,42" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <circle cx="34" cy="42" r="2.5" fill="#FBBF24" />

  <!-- 2. Automation Gear Wheel -->
  <!-- Circular Gear Rim -->
  <circle cx="54" cy="54" r="26" stroke="#FFFFFF" stroke-opacity="0.439" stroke-width="3.2" fill="none" />

  <!-- 4 Orthogonal Teeth -->
  <path d="M51.5,22.5 h5 v6 h-5 z M51.5,79.5 h5 v6 h-5 z M22.5,51.5 h6 v5 h-6 z M79.5,51.5 h6 v5 h-6 z" fill="#FFFFFF" fill-opacity="0.439" />

  <!-- 4 Diagonal Teeth (45 degree rotation) -->
  <g transform="rotate(45, 54, 54)">
    <path d="M51.5,22.5 h5 v6 h-5 z M51.5,79.5 h5 v6 h-5 z M22.5,51.5 h6 v5 h-6 z M79.5,51.5 h6 v5 h-6 z" fill="#FFFFFF" fill-opacity="0.439" />
  </g>

  <!-- 3. Bluetooth Symbol -->
  <path d="M44,45 L62,61 L54,69 L54,39 L62,47 L44,63" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Small Automation Spark / Center Accent -->
  <path d="M54.5,49 L51,54 L54.5,54 L53,59 L57,54 L53.5,54 Z" fill="#FBBF24" stroke="#FBBF24" stroke-width="0.8" stroke-linejoin="round" />
</svg>
